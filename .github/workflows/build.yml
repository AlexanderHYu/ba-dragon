name: 打包 EXE（自动构建）

on:
  push:
    tags:
      - 'v*'            # 推 v5.0.0 这类标签时自动打包并发布
  workflow_dispatch: {} # 也可以在 Actions 页面手动跑，只出产物不发布

permissions:
  contents: write   # 创建 Release 需要

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Node.js 22（LTS）
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试（对拍需要老仓库，CI 上会自动跳过）
        run: npm test

      - name: 下载 FFmpeg（录像用，带 SHA256 校验）
        run: npm run fetch-ffmpeg

      - name: 打包（nsis 安装版 + portable 免安装版）
        run: npm run dist

      - name: 上传构建产物（工作流页面可下载）
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: |
            dist/*.exe
            dist/latest.yml
          if-no-files-found: error

      - name: 创建 GitHub Release（仅打标签时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          fail_on_unmatched_files: false
